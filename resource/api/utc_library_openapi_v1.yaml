openapi: 3.0.3
info:
  title: UTC Library Management RESTful API
  version: 1.0.0
servers:
  - url: https://api.lib.utc.edu.vn/api/v1
paths:
  /auth/login:
    post: { summary: Đăng nhập nhận JWT Token }
  /books:
    get: { summary: Tra cứu danh sách đầu sách OPAC }
    post: { summary: Thêm đầu sách mới (Thủ thư) }
  /books/{id}/copies:
    post: { summary: Nhập bản sao sách & sinh mã Barcode }
  /loans:
    post: { summary: Lập phiếu mượn sách }
  /loans/{id}/return:
    post: { summary: Trả sách & tự động tính phạt / giữ chỗ }
  /loans/{id}/renew:
    patch: { summary: Gia hạn phiếu mượn }
  /reservations:
    post: { summary: Đặt trước sách khi hết bản sao trên kệ }
  /fines/{id}/pay:
    post: { summary: Thanh toán tiền phạt qua VietQR }
